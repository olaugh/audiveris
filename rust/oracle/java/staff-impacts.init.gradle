//
// Runs StaffImpactsProbe against the app's own runtime classpath, the same way
// parity.init.gradle runs RustParityProbe. Kept separate because it takes page
// arguments and is a diagnostic rather than part of the vector suite.

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) {
        return
    }
    def outputDir = app.layout.buildDirectory.dir('rust-impacts/classes')
    def musicXmlExportOutputDir = app.layout.buildDirectory.dir('rust-musicxml-export/classes')

    app.tasks.register('compileStaffImpactsProbe', JavaCompile) {
        source = app.fileTree("${gradle.rootProject.projectDir}/rust/oracle/java") {
            include '**/*.java'
        }
        classpath = app.sourceSets.test.runtimeClasspath
        destinationDirectory = outputDir
        options.release.set(25)
    }

    // Compile export independently of the parity-oracle source tree. This keeps the GUI's PAGE
    // export command available while an unrelated diagnostic probe is being developed.
    app.tasks.register('compileMusicXmlExportProbe', Exec) {
        // JavaCompile fingerprints every classpath entry before it invokes javac. On a synced
        // checkout that scan can take longer than PAGE itself. This explicit one-file compile has
        // no incremental state to protect and still uses Gradle's exact application classpath.
        doFirst {
            def classes = musicXmlExportOutputDir.get().asFile
            classes.mkdirs()
            commandLine(
                    new File(System.getProperty('java.home'), 'bin/javac').absolutePath,
                    '--release', '25',
                    '-cp', app.sourceSets.main.runtimeClasspath.asPath,
                    '-d', classes.absolutePath,
                    "${gradle.rootProject.projectDir}/rust/oracle/java/org/audiveris/omr/rustport/MusicXmlExportProbe.java")
        }
    }

    // A separate task, property set, and stdout prefix keep export additive to both `sigProbe`
    // and `sigStreamProbe`. Each path is its own Gradle argument, so spaces are unambiguous.
    app.tasks.register('musicXmlExportProbe', JavaExec) {
        dependsOn 'compileMusicXmlExportProbe'
        classpath = app.files(musicXmlExportOutputDir) + app.sourceSets.main.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.MusicXmlExportProbe'
        workingDir = app.projectDir
        maxHeapSize = (app.findProperty('musicXmlExportXmx') ?: '8g').toString()
        doNotTrackState('interactive export writes to the caller path; no reusable task output')
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"

        def resolve = { String value ->
            if (value.isEmpty()) {
                return value
            }
            def file = new File(value)
            return (file.isAbsolute() ? file
                    : new File(gradle.rootProject.projectDir, value)).absolutePath
        }
        def input = (app.findProperty('musicXmlExportInput') ?: '').toString()
        def sheet = (app.findProperty('musicXmlExportSheet') ?: '').toString()
        def output = (app.findProperty('musicXmlExportOutput') ?: '').toString()
        args = [resolve(input), sheet, resolve(output)]
    }

    // The probe drives the step engine itself rather than going through
    // Audiveris's -run hook, because that hook fires after the sheets are
    // disposed and their impacts are not persisted. See the probe's own note.
    app.tasks.register('staffImpactsProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.StaffImpactsProbe'
        workingDir = gradle.rootProject.projectDir
        def pages = (app.findProperty('impactPages') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
        args = pages
    }

    app.tasks.register('gridPdfProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.GridPdfProbe'
        workingDir = gradle.rootProject.projectDir
        // -PgridPdfPages="/abs/file.pdf:2 /abs/other.pdf:1"
        args = (app.findProperty('gridPdfPages') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
    }

    // Morphology is a unit probe: with no arguments it needs no sheet at all,
    // because the structuring element and the closing arithmetic do not depend
    // on one. Arguments add the real-page cases.
    app.tasks.register('morphoProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.MorphoProbe'
        workingDir = app.projectDir
        // Audiveris logs at DEBUG to stdout by default, which buries the
        // records under a hundred times their number in noise.
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        // -PmorphoTargets="data/examples/chula.png:1"
        args = (app.findProperty('morphoTargets') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
                .collect { target ->
                    def bits = target.split(':')
                    def file = new File(bits[0])
                    def resolved = file.isAbsolute() ? file
                            : new File(gradle.rootProject.projectDir, bits[0])
                    ([resolved.absolutePath] + bits[1..-1]).join(':')
                }
    }

    app.tasks.register('spotsProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.SpotsProbe'
        workingDir = app.projectDir
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        // -PspotsTargets="data/examples/chula.png:1"
        args = (app.findProperty('spotsTargets') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
                .collect { target ->
                    def bits = target.split(':')
                    def file = new File(bits[0])
                    def resolved = file.isAbsolute() ? file
                            : new File(gradle.rootProject.projectDir, bits[0])
                    ([resolved.absolutePath] + bits[1..-1]).join(':')
                }
    }

    app.tasks.register('beamsProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.BeamsProbe'
        workingDir = app.projectDir
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        // -PbeamsTargets="data/examples/chula.png:1"
        args = (app.findProperty('beamsTargets') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
                .collect { target ->
                    def bits = target.split(':')
                    def file = new File(bits[0])
                    def resolved = file.isAbsolute() ? file
                            : new File(gradle.rootProject.projectDir, bits[0])
                    ([resolved.absolutePath] + bits[1..-1]).join(':')
                }
    }

    app.tasks.register('beamStemSeedsProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.BeamStemSeedsProbe'
        workingDir = app.projectDir
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        // -PbeamStemSeedTargets="data/examples/chula.png:1"
        args = ['--' + (app.findProperty('beamStemSeedMode') ?: 'seeded').toString()] +
                (app.findProperty('beamStemSeedTargets') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
                .collect { target ->
                    def bits = target.split(':')
                    def file = new File(bits[0])
                    def resolved = file.isAbsolute() ? file
                            : new File(gradle.rootProject.projectDir, bits[0])
                    ([resolved.absolutePath] + bits[1..-1]).join(':')
                }
    }

    app.tasks.register('sigProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.SigProbe'
        // Audiveris running from .class files resolves its read-only resources
        // as `Paths.get("res")`, relative to the process working directory, and
        // they live in app/. Anything from HEADERS onward needs the bundled
        // classifier from there, so the working directory is app/ and the page
        // arguments are absolutised against the project root to compensate.
        workingDir = app.projectDir
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        // -PsigTargets="data/examples/chula.png:1:GRID other.pdf:2:HEADS"
        args = (app.findProperty('sigTargets') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
                .collect { target ->
                    def bits = target.split(':')
                    def file = new File(bits[0])
                    def resolved = file.isAbsolute() ? file
                            : new File(gradle.rootProject.projectDir, bits[0])
                    ([resolved.absolutePath] + bits[1..-1]).join(':')
                }
    }

    // Live omrscope mode deliberately remains a separate task and property so
    // the long-standing `sigProbe` command keeps its exact stdout contract.
    // SigProbe receives the explicit leading switch and frames the same
    // line-oriented checkpoint payloads with `@omrscope` control records.
    app.tasks.register('sigStreamProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.SigProbe'
        workingDir = app.projectDir
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        // -PsigStreamTargets="data/examples/chula.png:1:HEADS"
        args = ['--stream'] + (app.findProperty('sigStreamTargets') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
                .collect { target ->
                    def bits = target.split(':')
                    def file = new File(bits[0])
                    def resolved = file.isAbsolute() ? file
                            : new File(gradle.rootProject.projectDir, bits[0])
                    ([resolved.absolutePath] + bits[1..-1]).join(':')
                }
    }

    app.tasks.register('ledgersProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.LedgersProbe'
        workingDir = app.projectDir
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        // -PledgerTargets="data/examples/chula.png:1"
        args = (app.findProperty('ledgerTargets') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
                .collect { target ->
                    def bits = target.split(':')
                    def file = new File(bits[0])
                    def resolved = file.isAbsolute() ? file
                            : new File(gradle.rootProject.projectDir, bits[0])
                    ([resolved.absolutePath] + bits[1..-1]).join(':')
                }
    }

    // Prints every KeyAlterInter's grade and measured pitch as raw bits, with
    // the staff-line ordinates and reference points behind them. The port's
    // header grades differ from Java by 2-3 ulp on two alters, and by different
    // ulp counts, so the divergence is per-glyph input rather than a shared
    // scale; this is what lets it be located instead of reasoned about.
    app.tasks.register('keyAlterPitchProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'KeyAlterPitchBits'
        workingDir = app.projectDir
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        // -PkeyAlterTargets="data/examples/chula.png"
        args = (app.findProperty('keyAlterTargets') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
                .collect { target ->
                    def file = new File(target)
                    (file.isAbsolute() ? file
                            : new File(gradle.rootProject.projectDir, target)).absolutePath
                }
    }

    app.tasks.register('stemSeedsProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.StemSeedsProbe'
        workingDir = app.projectDir
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        // -PstemSeedTargets="data/examples/chula.png:1"
        args = (app.findProperty('stemSeedTargets') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
                .collect { target ->
                    def bits = target.split(':')
                    def file = new File(bits[0])
                    def resolved = file.isAbsolute() ? file
                            : new File(gradle.rootProject.projectDir, bits[0])
                    ([resolved.absolutePath] + bits[1..-1]).join(':')
                }
    }

    app.tasks.register('stemSeedGlyphsProbe', JavaExec) {
        dependsOn 'compileStaffImpactsProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.StemSeedGlyphsProbe'
        workingDir = app.projectDir
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        // -PstemSeedTargets="data/examples/chula.png:1"
        args = (app.findProperty('stemSeedTargets') ?: '').toString().split(/\s+/)
                .findAll { !it.isEmpty() }
                .collect { target ->
                    def bits = target.split(':')
                    def file = new File(bits[0])
                    def resolved = file.isAbsolute() ? file
                            : new File(gradle.rootProject.projectDir, bits[0])
                    ([resolved.absolutePath] + bits[1..-1]).join(':')
                }
    }
}
