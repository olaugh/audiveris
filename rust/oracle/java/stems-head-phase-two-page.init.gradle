gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    def repoRoot = providers.gradleProperty('rustPortRepo').get()
    def outputDir = app.layout.buildDirectory.dir('rust-head-phase-two-page/classes')
    app.tasks.register('compileStemsHeadPhaseTwoPageProbe', JavaCompile) {
        source = file("${repoRoot}/rust/oracle/java/StemsHeadPhaseTwoPageProbe.java")
        classpath = app.sourceSets.test.runtimeClasspath
        destinationDirectory = outputDir
        options.release.set(25)
    }
    app.tasks.register('stemsHeadPhaseTwoPageProbe', JavaExec) {
        dependsOn 'compileStemsHeadPhaseTwoPageProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.StemsHeadPhaseTwoPageProbe'
        workingDir = app.projectDir
        maxHeapSize = '48g'
        jvmArgs '-XX:+UnlockExperimentalVMOptions', '-XX:+UseEpsilonGC'
        systemProperty 'logback.configurationFile',
                "${repoRoot}/rust/oracle/java/logback-quiet.xml"
        args = [providers.gradleProperty('phaseTwoPage').get()]
    }
}
