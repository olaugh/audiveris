gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return

    def repoRoot = providers.gradleProperty('rustPortRepo').get()
    def outputDir = app.layout.buildDirectory.dir('rust-head-phase-bach-system2-order183/classes')
    app.tasks.register('compileStemsHeadPhaseBachSystem2Order183Probe', JavaCompile) {
        source = file("${repoRoot}/rust/oracle/java/StemsHeadPhaseOneBachSystem2Order183Probe.java")
        classpath = app.sourceSets.test.runtimeClasspath
        destinationDirectory = outputDir
        options.release.set(25)
    }

    app.tasks.register('stemsHeadPhaseBachSystem2Order183Probe', JavaExec) {
        dependsOn 'compileStemsHeadPhaseBachSystem2Order183Probe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.StemsHeadPhaseOneBachSystem2Order183Probe'
        workingDir = app.projectDir
        maxHeapSize = '16g'
        jvmArgs '-XX:+UseG1GC'
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        args = [providers.gradleProperty('phaseOneOrder183Page').get()]
    }
}
