gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return

    def repoRoot = providers.gradleProperty('rustPortRepo').get()
    def outputDir = app.layout.buildDirectory.dir('rust-head-multibeam-bach/classes')
    app.tasks.register('compileStemsHeadMultiBeamBachProbe', JavaCompile) {
        source = file("${repoRoot}/rust/oracle/java/StemsHeadMultiBeamCLinkPageProbe.java")
        classpath = app.sourceSets.test.runtimeClasspath
        destinationDirectory = outputDir
        options.release.set(25)
    }

    app.tasks.register('stemsHeadMultiBeamBachProbe', JavaExec) {
        dependsOn 'compileStemsHeadMultiBeamBachProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.StemsHeadMultiBeamCLinkPageProbe'
        workingDir = app.projectDir
        maxHeapSize = '16g'
        jvmArgs '-XX:+UseG1GC'
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        args = [providers.gradleProperty('multiBeamPage').get()]
    }
}
