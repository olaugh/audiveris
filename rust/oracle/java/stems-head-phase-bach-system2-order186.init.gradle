gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return

    def outputDir = app.layout.buildDirectory.dir('rust-head-phase-bach-system2-order186/classes')
    app.tasks.register('compileStemsHeadPhaseBachSystem2Order186Probe', JavaCompile) {
        source = file(providers.gradleProperty('order186Probe').get())
        classpath = app.sourceSets.test.runtimeClasspath
        destinationDirectory = outputDir
        options.release.set(25)
    }

    app.tasks.register('stemsHeadPhaseBachSystem2Order186Probe', JavaExec) {
        dependsOn 'compileStemsHeadPhaseBachSystem2Order186Probe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.StemsHeadPhaseOneBachSystem2Order186Probe'
        workingDir = app.projectDir
        maxHeapSize = '16g'
        jvmArgs '-XX:+UseG1GC'
        systemProperty 'logback.configurationFile',
                "${gradle.rootProject.projectDir}/rust/oracle/java/logback-quiet.xml"
        args = [providers.gradleProperty('phaseOneOrder186Page').get()]
    }
}
