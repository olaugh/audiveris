gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) {
        return
    }
    def outputDir = app.layout.buildDirectory.dir('rust-parity/classes')

    app.tasks.register('compileRustParityProbe', JavaCompile) {
        source = app.fileTree("${gradle.rootProject.projectDir}/rust/oracle/java") {
            include '**/*.java'
        }
        classpath = app.sourceSets.test.runtimeClasspath
        destinationDirectory = outputDir
        options.release.set(25)
    }

    app.tasks.register('rustParityProbe', JavaExec) {
        dependsOn 'compileRustParityProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.RustParityProbe'
        workingDir = gradle.rootProject.projectDir
    }

    // A measurement rather than a parity vector, so it is a separate task: it
    // answers what MusicFont actually costs before any of it is ported, and its
    // output is read by a human, not diffed. Note the working directory --
    // `WellKnowns.RES_URI` is `Paths.get("res")` when not running from a jar, so
    // the fonts resolve only from app/, unlike the probe which reads app/res and
    // data/ by explicit path from the root.
    app.tasks.register('musicFontScout', JavaExec) {
        dependsOn 'compileRustParityProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.MusicFontScout'
        workingDir = app.projectDir
        systemProperty 'java.awt.headless', 'true'
    }

    // The clef oracle drives the real pipeline to HEADERS, so unlike the scout it needs both the
    // fonts (relative to app/) and the corpus (at the repository root, reached as ../data).
    app.tasks.register('clefProbe', JavaExec) {
        dependsOn 'compileRustParityProbe'
        classpath = app.files(outputDir) + app.sourceSets.test.runtimeClasspath
        mainClass = 'org.audiveris.omr.rustport.ClefProbe'
        workingDir = app.projectDir
        systemProperty 'java.awt.headless', 'true'
        maxHeapSize = '4g'
    }
}
