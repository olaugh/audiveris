[workspace]
members = [
    "crates/audiveris-core",
    "crates/audiveris-cli",
    "crates/audiveris-image",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
authors = ["Audiveris contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
