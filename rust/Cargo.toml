[workspace]
members = [
    "crates/audiveris-core",
    "crates/audiveris-classifier",
    "crates/audiveris-cli",
    "crates/audiveris-image",
    "crates/audiveris-jpeg",
    "crates/audiveris-omr",
    "crates/audiveris-pdf",
    "crates/audiveris-testkit",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
authors = ["Audiveris contributors"]

[workspace.lints.rust]
# `deny`, not `forbid`, solely so `audiveris-jpeg`'s differential test can call
# libjpeg as its reference decoder. No shipped code contains `unsafe`:
# `audiveris-jpeg` itself is `#![forbid(unsafe_code)]`, and libjpeg is a
# dev-dependency of that one crate. Every other `unsafe` is a build failure.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# Tests here are compute-bound in a way most workspaces' are not: they run the
# real recognition pipeline over multi-megapixel pages -- a morphological
# closing is about 1.3 billion operations on one sheet -- and CI spends over 95%
# of its wall clock inside them. Unoptimised that is six minutes a leg.
#
# `opt-level = 2` on the dev profile buys most of a release build's speed while
# keeping `debug_assertions` and integer overflow checks on, which is the point:
# a port graded on exact arithmetic wants its overflow checks live in CI.
# Dependencies are optimised too, since the image and PDF decoders sit in the
# hot path.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
