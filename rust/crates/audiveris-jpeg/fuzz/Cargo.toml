[package]
name = "audiveris-jpeg-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The oracle here is libjpeg-turbo, so the decoder is built to match it.
audiveris-jpeg = { path = "..", features = ["libjpeg-turbo"] }
mozjpeg-sys = "2"

[[bin]]
name = "decode_never_panics"
path = "fuzz_targets/decode_never_panics.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matches_libjpeg"
path = "fuzz_targets/matches_libjpeg.rs"
test = false
doc = false
bench = false

[workspace]
