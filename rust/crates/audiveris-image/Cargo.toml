[package]
name = "audiveris-image"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
audiveris-core = { path = "../audiveris-core" }
image = { version = "0.25", default-features = false, features = ["png"] }
# JPEG goes through libjpeg-turbo, not a pure-Rust decoder. Java's ImageIO
# reader is libjpeg-backed and the pure-Rust decoders do not reproduce it: on
# the one JPEG in the example corpus `zune-jpeg` differs from libjpeg on 177046
# of 5018112 grayscale samples, which flips 844 binary pixels and perturbs
# everything GRID derives from them. `mozjpeg-sys` vendors and builds
# libjpeg-turbo, whose decoder is bit-identical to libjpeg's.
mozjpeg-sys = "2"


[lints]
workspace = true
