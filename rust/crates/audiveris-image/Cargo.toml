[package]
name = "audiveris-image"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
audiveris-core = { path = "../audiveris-core" }
image = { version = "0.25", default-features = false, features = ["png"] }
# JPEG goes through our own decoder, which reproduces libjpeg sample for
# sample. The `image` crate's `zune-jpeg` does not: on the one JPEG in the
# example corpus it differs from libjpeg on 177046 of 5018112 grayscale
# samples, which flips 844 binary pixels and perturbs everything GRID derives
# from them.
audiveris-jpeg = { path = "../audiveris-jpeg" }
# PDF pages are rendered, not extracted: Audiveris runs them through PDFBox's
# rasterizer and binarizes the result, so the ingest reproduces that render.
audiveris-pdf = { path = "../audiveris-pdf" }


[lints]
workspace = true
