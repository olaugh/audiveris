name: Rust port

# The Rust workspace under `rust/` is a parallel tree: it shares no build with
# the Gradle job in `build-and-test.yml` and is not part of the Java artifact.
# It therefore gets its own workflow, running only when something it depends on
# moves -- the workspace itself, or the image fixtures under `data/` that its
# tests decode.
#
# Two operating systems on purpose. The port's whole claim is bit-exact
# reproduction of what Java produces, and "bit-exact" is a claim about every
# host or it is not a claim. The matrix also covers two architectures, since
# `macos-latest` is aarch64 and `ubuntu-latest` is x86_64 -- which is the axis
# that actually caught something: `mozjpeg-sys`, the differential reference for
# `audiveris-jpeg`, enables SIMD whenever the host allows it (always on aarch64,
# only with nasm installed on x86), and its SIMD routines disagree with its own
# scalar C on damaged input. The dev-dependency now pins the scalar build, both
# because libjpeg 6b -- the library Audiveris actually reads through -- has no
# SIMD at all, and so that this matrix compares the same reference on both legs.

on:
  push:
    paths:
      - "rust/**"
      - "data/**"
      - ".github/workflows/rust-port.yml"
  pull_request:
    paths:
      - "rust/**"
      - "data/**"
      - ".github/workflows/rust-port.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-port-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  # Six splits the suite to roughly ten minutes a shard. The floor is the
  # single heaviest binary, about six minutes, so more shards buy little.
  TEST_SHARDS: 6

jobs:
  check:
    name: ${{ matrix.os }} ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    # Keep over twice the observed cold-cache shard time. The unsharded job
    # used to sit at 60 and reached it, and a cold macOS shard later reached 30;
    # leaving this headroom keeps a passing suite from reading as a failure
    # while still killing a genuine hang.
    timeout-minutes: 45
    strategy:
      # Report every leg. A divergence that appears on one host and not the
      # other is the most interesting result this workflow can produce, and
      # cancelling the rest would hide most of it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # `cargo test` runs test binaries one after another and this suite is
        # compute-bound -- each corpus binary drives the real pipeline over a
        # multi-megapixel page -- so splitting by binary is close to a linear
        # win. `rust/ci/select-test-shard.py` does the assignment.
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # `rust/rust-toolchain.toml` pins the channel and names the components;
      # rustup installs exactly that on the first command that needs it. Asking
      # for versions is both the trigger and a record in the log of what the
      # rest of the run was graded by.
      - name: Install the pinned toolchain
        run: |
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          # `rust/Cargo.toml` is in the key because it carries the build
          # profile. `actions/cache` does not re-save on an exact key hit, so a
          # key that ignores the profile would keep serving dependency objects
          # built at the *old* opt-level indefinitely, and every run would pay
          # to rebuild them.
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Whole-workspace checks are fast and shard-independent, so one shard
      # runs them rather than all six repeating the same work.
      - name: Formatting
        if: matrix.shard == 0
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.shard == 0
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Build every target, not just this shard's. It keeps the cached
      # `target/` complete whichever shard saves it, and it means a compile
      # error fails every shard rather than only the one that owns the file.
      - name: Build all test targets
        run: cargo test --workspace --no-run

      # The sharding's one real hazard is a silent gap: a target kind the
      # assignment does not know about would stop running with nothing to say
      # so. Compare the plan against the binaries cargo actually built, and
      # fail if they differ. (This caught `--bin` unit tests when the split was
      # first written.)
      # `--doc` items build nothing, so they are absent from cargo's executable
      # list by design and are filtered out of the comparison below.
      - name: Verify the shards cover every target
        if: matrix.shard == 0
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/actual.txt
          import json, subprocess
          out = subprocess.run(
              ["cargo", "test", "--workspace", "--no-run", "--message-format=json"],
              capture_output=True, text=True, check=True).stdout
          names = set()
          for line in out.splitlines():
              try:
                  message = json.loads(line)
              except ValueError:
                  continue
              if message.get("profile", {}).get("test") and message.get("executable"):
                  names.add(message["target"]["name"])
          print("\n".join(sorted(names)))
          PY
          for index in $(seq 0 $((TEST_SHARDS - 1))); do
            python3 ci/select-test-shard.py --shards "$TEST_SHARDS" --shard "$index"
          done | python3 -c '
          import sys
          planned = set()
          for line in sys.stdin:
              tokens = line.split()
              if "--test" in tokens:
                  planned.add(tokens[tokens.index("--test") + 1])
              elif "--bin" in tokens:
                  planned.add(tokens[tokens.index("--bin") + 1])
              elif "--lib" in tokens:
                  planned.add(tokens[tokens.index("-p") + 1].replace("-", "_"))
          print("\n".join(sorted(planned)))' > /tmp/planned.txt
          if ! diff -u /tmp/actual.txt /tmp/planned.txt; then
            echo "::error::shard plan does not cover every test target" >&2
            exit 1
          fi
          echo "shard plan covers all $(wc -l < /tmp/actual.txt | tr -d ' ') targets"

      # Over 95% of this workflow's wall clock is here, and it is compute, not
      # compilation: the corpus tests run the real pipeline over
      # multi-megapixel pages. `rust/Cargo.toml` raises the dev profile to
      # `opt-level = 2` for that reason, which cut the run from roughly six
      # minutes to well under one while keeping debug assertions and overflow
      # checks live.
      - name: Tests
        run: |
          python3 ci/select-test-shard.py --shards "$TEST_SHARDS" --plan
          status=0
          while read -r args; do
            [ -n "$args" ] || continue
            echo "::group::cargo test $args"
            # shellcheck disable=SC2086
            cargo test $args || status=1
            echo "::endgroup::"
          done < <(python3 ci/select-test-shard.py --shards "$TEST_SHARDS" --shard "${{ matrix.shard }}")
          exit $status
        shell: bash

      # `cargo test` captures the output of tests that pass, and the PDF corpus
      # test passes by *skipping* when `AUDIVERIS_PDF_CORPUS` is unset -- which
      # it is here, because the corpus is 20 MB of third-party IMSLP scans that
      # this workflow deliberately does not fetch. Re-run it visibly so the log
      # says which of the two it did. See `rust/HANDOFF.md` for running it with
      # the corpus present.
      - name: Report the PDF corpus test's coverage
        if: matrix.shard == 0
        run: cargo test -p audiveris-pdf --test corpus -- --nocapture
